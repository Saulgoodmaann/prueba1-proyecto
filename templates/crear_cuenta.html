<!DOCTYPE html>
<html>
<head>
    <title>Crear Cuenta</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image.png" href="/static/banco.png">
</head>
<body>

<div class="contenedor">
    <div class="tarjeta">

        <i class="bi bi-person-plus icono-principal"></i>

        <h1>Crear Cuenta</h1>

        <p class="descripcion">
            Registra una nueva cuenta bancaria para comenzar a utilizar el sistema.
        </p>

        <form method="POST">

            <input type="text"
                   name="numero"
                   placeholder="Número de cuenta"
                   required>

            <input type="text"
                   name="propietario"
                   placeholder="Nombre del propietario"
                   required>

            <input type="password"
                   name="pin"
                   placeholder="PIN"
                   required>

            <input type="number"
                   name="saldo"
                   placeholder="Saldo inicial"
                   required>

            <button type="submit" class="btn-principal">
                Crear cuenta
            </button>

        </form>

        <a href="/" class="btn-secundario">
            Regresar
        </a>

    </div>
</div>

</body>
</html>
