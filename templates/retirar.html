<!DOCTYPE html>
<html>
<head>
    <title>Retirar</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image.png" href="/static/banco.png">
</head>
<body>

<div class="contenedor">
    <div class="tarjeta">

        <i class="bi bi-wallet2 icono-principal"></i>

        <h1>Retirar Dinero</h1>

        <p class="descripcion">
            Retira dinero disponible de tu cuenta bancaria.
        </p>

        <form method="POST">

            <input type="number"
                   name="monto"
                   placeholder="Monto a retirar"
                   required>

            <button type="submit" class="btn-principal">
                Retirar
            </button>

        </form>

        

        <a href="/panel" class="btn-secundario">
            Regresar
        </a>
        <p class="mensaje">{{ mensaje }}</p>
    </div>
</div>

</body>
</html>
