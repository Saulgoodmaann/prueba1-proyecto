<!DOCTYPE html>
<html>
<head>
    <title>Transferencia</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image.png" href="/static/banco.png">
</head>
<body>

<div class="contenedor">
    <div class="tarjeta">

        <i class="bi bi-arrow-left-right icono-principal"></i>

        <h1>Transferencia</h1>

        <p class="descripcion">
            Envía dinero a otra cuenta bancaria registrada.
        </p>

        <form method="POST">

            <input type="text"
                   name="destino"
                   placeholder="Cuenta destino"
                   required>

            <input type="number"
                   name="monto"
                   placeholder="Monto a transferir"
                   required>

            <button type="submit" class="btn-principal">
                Transferir
            </button>

        </form>

        <p class="mensaje">{{ mensaje }}</p>

        <a href="/panel" class="btn-secundario">
            Regresar
        </a>

    </div>
</div>

</body>
</html>
